version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: civic_waste_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=civic_waste_db

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: civic_waste_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=civic_waste_db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - JWT_SECRET=${JWT_SECRET:-ulb-secret-jwt-key-2026}
      - TIMEZONE=Asia/Kolkata
    depends_on:
      - mongodb
    volumes:
      - ./uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: civic_waste_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
